services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-granero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-granero}
      POSTGRES_DB: ${POSTGRES_DB:-granero}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-granero}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-granero}:${POSTGRES_PASSWORD:-granero}@postgres:5432/${POSTGRES_DB:-granero}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@granero.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_FULL_NAME: Administrador
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
      - ./backend/alembic:/code/alembic
      - ./backend/scripts:/code/scripts
      - ./backend/tests:/code/tests

  adminer:
    image: adminer
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  pgdata:
